<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="《具身智能技术》系列：入门篇与系统篇。在线免费阅读，可下载 PDF。">
  <title>具身智能技术 · Embodied Intelligence</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <style>
    :root { --theme-color: #155e75; }
    .markdown-section { max-width: 900px; padding-bottom: 60px; }
    .markdown-section h1 { font-size: 1.85rem; line-height: 1.4; margin: 1.2em 0 .8em; }
    .markdown-section h2 { font-size: 1.32rem; margin: 1.8em 0 .6em; padding-left: .5em;
                           border-left: 3px solid var(--theme-color); }
    .markdown-section h3 { font-size: 1.08rem; margin: 1.4em 0 .5em; }
    .markdown-section p, .markdown-section li { line-height: 1.85; }
    .markdown-section blockquote { border-left: 3px solid #9fc3cf; background: #f4f8fa;
                                   padding: .6em 1em; color: #4b5563; }
    .markdown-section img { max-width: 100%; }
    .markdown-section figure { margin: 1.4em 0; text-align: center; }
    .markdown-section figcaption { font-size: .86rem; color: #6b7280; margin-top: .5em; }
    .markdown-section table { font-size: .9rem; display: table; width: 100%; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: .2em 0; }
    .app-nav { margin-right: 12px; }

    section.cover {
      background-color: #07110f !important;
      background-image: url(books/intro/images/cover-art.jpg) !important;
      background-size: cover !important;
      background-position: 50% 46% !important;
      background-repeat: no-repeat !important;
      color: #f2f8f6;
    }
    section.cover::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(100deg, rgba(4,12,11,.94) 0%, rgba(4,12,11,.76) 45%,
                  rgba(4,12,11,.44) 76%, rgba(4,12,11,.30) 100%);
    }
    section.cover .cover-main { position: relative; z-index: 1; }
    section.cover .cover-main h1,
    section.cover .cover-main h1 a,
    section.cover .cover-main h1 span { color: #fff !important; letter-spacing: .1em;
      text-shadow: 0 3px 30px rgba(2,8,8,.95); }
    section.cover .cover-main blockquote { color: rgba(236,246,246,.92); border-left: none; }
    section.cover .cover-main p { color: rgba(226,240,240,.88); }
    section.cover .cover-main > p:last-child a {
      border-radius: 4px; padding: .7em 2.2em; font-size: 1rem; margin: 6px 4px;
      border: 1px solid rgba(242,193,78,.75); color: #fff;
      background: rgba(21,94,117,.62); transition: background .2s;
    }
    section.cover .cover-main > p:last-child a:hover { background: rgba(21,94,117,.95); }
  </style>
</head>
<body>
  <div id="app">正在加载…</div>

  <script>
    // 静态文件（PDF 等）不走 hash 路由
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#/"]');
      if (!a) return;
      var m = a.getAttribute('href').match(/^#\/(.+\.(?:pdf|zip|png|jpe?g|gif|svg|json|txt|csv))$/i);
      if (!m) return;
      e.preventDefault();
      window.open(new URL('.', location.href).pathname + m[1], '_blank', 'noopener');
    }, true);

    window.$docsify = {
      name: '具身智能技术',
      nameLink: '/',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 2,
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      maxLevel: 3,
      // 站内链接统一写仓库绝对路径；各册目录下各放一份 _sidebar.md，docsify 会自动就近加载
      search: {
        placeholder: '搜索全系列…',
        noData: '没有找到结果',
        depth: 3,
        paths: ['/', '/books/intro/', '/books/system/']
      },
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },
      mermaid: { theme: 'default' },
      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html) {
            try {
              var base = new URL('.', location.href).pathname;    // '/' 或 '/<repo>/'
              var path = (vm && vm.route && vm.route.path) || decodeURIComponent(location.hash || '');
              var m = path.match(/books\/([^\/]+)\//);
              var vol = m ? m[1] : '';
              if (vol) {
                html = html.replace(/(src=")\.\.\/images\//g,
                                    '$1' + base + 'books/' + vol + '/images/');
              }
              // 册首页里写的是相对本章的链接（GitHub 端可直接点），站点里重写成 hash 路由
              if (vol && /^\/?books\/[^\/]+\/README(\.md)?$/.test(path)) {
                html = html.replace(/href="#\/chapters\//g,
                                    'href="#/books/' + vol + '/chapters/');
              }
            } catch (e) { /* 保守起见不阻断渲染 */ }
            return html;
          });
          hook.doneEach(function () {
            var base = new URL('.', location.href).pathname;
            document.querySelectorAll('a[href^="#/"]').forEach(function (a) {
              var m = a.getAttribute('href').match(/^#\/(.+\.(?:pdf|zip|png|jpe?g|gif|svg|json|txt|csv))$/i);
              if (m) { a.setAttribute('href', base + m[1]); a.setAttribute('target', '_blank'); }
            });
            var el = document.querySelector('.markdown-section');
            if (!el || typeof renderMathInElement !== 'function') return;
            renderMathInElement(el, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '\\[', right: '\\]', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\(', right: '\\)', display: false }
              ],
              ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option'],
              throwOnError: false,
              macros: { '\\RR': '\\mathbb{R}', '\\bm': '\\boldsymbol{#1}', '\\T': '^{\\top}' }
            });
          });
        }
      ]
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
</body>
</html>
